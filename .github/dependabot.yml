# Dependabot ouvre une pull request quand une dependance sort une nouvelle version.
# La CI verifie cette pull request avant toute fusion.
# cooldown : on attend 7 jours avant de proposer une version toute fraiche.
# Une version publiee depuis quelques heures peut etre instable ou compromise
# (attaque de la chaine d'approvisionnement). Ce delai laisse le temps de la retirer.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  # Les hooks de pre-commit, suivis eux aussi.
  #
  # Pourquoi cette section existe : ruff est epingle a deux endroits, dans `pyproject.toml` pour
  # le projet et dans `.pre-commit-config.yaml` pour le hook. Dependabot ne suivait que le
  # premier. Chaque montee de version recreait donc l'incident du 2026-09-28 : le hook reformatait
  # d'une facon, l'integration continue exigeait l'autre, et le commit ne passait jamais.
  #
  # Un test du depot verifie que les deux versions restent identiques. Cette section evite d'avoir
  # a le corriger a la main a chaque fois.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
