# Verifications lancees automatiquement avant chaque commit.
# Installation une seule fois : pre-commit install
# Lancer sur tout le depot : pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Les figures sont produites par mesures/figures.py. Si un hook les retouche, le fichier
      # versionne ne correspond plus a ce que le script genere, et chaque regeneration produit
      # une difference. Un artefact genere ne se corrige pas a la main : on corrige son script.
      #
      # htmx est un fichier tiers, recopie tel quel depuis sa publication officielle. Lui
      # ajouter une fin de ligne le rendrait different de l'original, donc inverifiable :
      # son empreinte ne correspondrait plus a celle publiee. Un fichier tiers se verifie,
      # il ne se reformate pas. Voir services/site/statique/README.md.
      - id: trailing-whitespace
        exclude: ^(memoire/figures/|services/site/statique/htmx-)
      - id: end-of-file-fixer
        exclude: ^(memoire/figures/|services/site/statique/htmx-)
      - id: check-yaml
      - id: check-toml
      # Garde-fou contre un fichier de donnees commit par accident. Les notebooks executes sont
      # exclus : ils embarquent leurs graphiques, et c'est voulu, un notebook doit se lire sans
      # etre relance. Ils restent surveilles a la main, quelques centaines de Ko chacun.
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^analyses/.*\.ipynb$
      - id: check-merge-conflict

  # La version doit rester alignee sur celle de `pyproject.toml`. Deux versions differentes
  # formatent differemment : le hook reformate, la chaine d'integration exige l'inverse, et le
  # commit ne passe jamais. Incident rencontre le 2026-09-28.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
