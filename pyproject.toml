[project]
name = "commande-publique"
version = "0.1.0"
description = "Plateforme open source d'intelligence sur la commande publique francaise"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-duckdb>=1.9",
    "duckdb>=1.5.5",
    "fastapi>=0.120",
    # Gabarits du site. Jinja2 arrivait deja par transitivite (dbt, matplotlib) : il est
    # declare ici parce que le site en depend directement, et qu'une dependance
    # transitive peut disparaitre a la mise a jour d'un autre paquet.
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.3.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.38",
]

[dependency-groups]
# Outils de developpement uniquement. Ils ne partent jamais dans une image de production.
dev = [
    # Version epinglee au meme niveau que le hook pre-commit : deux versions differentes
    # formatent differemment et se contredisent a chaque commit.
    "ruff==0.17.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E, F : erreurs et fautes de base. I : ordre des imports. UP : syntaxe moderne.
# B : pieges courants. SIM : simplifications. S : securite (bandit).
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Les assertions sont normales dans les tests.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
pretty = true

# scikit-learn ne publie pas d'annotations de types. Plutot que de desactiver le mode strict sur
# tout le projet, on declare l'exception pour ce seul paquet : le reste du code continue d'etre
# verifie, et la dette est visible ici au lieu d'etre cachee dans un commentaire de fichier.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# La racine du projet est ajoutee au chemin d'import, pour que les tests puissent importer
# `mesures.decp_qualite` sans transformer chaque dossier en paquet installable.
pythonpath = ["."]
addopts = "-q --cov=. --cov-report=term-missing"
